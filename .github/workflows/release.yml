# Tag a version (git tag v1.0.0 && git push --tags) to publish the KiCad plugin zip as a GitHub release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the KiCad plugin package
        run: python kicad-plugin/build_pcm.py --out pcm
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" pcm/*.zip --title "${GITHUB_REF_NAME}" --notes "KiCad: Plugin and Content Manager -> Install from File... -> kilive-kicad-*.zip"
