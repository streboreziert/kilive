<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout generator test</title>
<style>
:root { --pcb-bg: #0b1014; --pcb-board: #111a20; --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1b2029; color: #dfe5ea; font: 13px/1.4 system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 14px; height: 44px; border-bottom: 1px solid #2c333d; overflow: hidden; }
header a { color: #9fc6ff; text-decoration: none; font-family: var(--font-mono); }
header a.on { color: #ffd21f; }
header .meta { margin-left: auto; color: #9aa7b1; font-family: var(--font-mono); }
.grid { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 44px - var(--warn-h, 0px)); }
.grid.one { grid-template-columns: 1fr; }
.pane { position: relative; overflow: hidden; border-right: 1px solid #2c333d; }
.pane.v3d { background: radial-gradient(circle at 50% 40%, #3b4352, #1b2029); }
#warn { margin: 0; padding: 6px 14px; font: 12px var(--font-mono); color: #f0c674; white-space: pre-wrap; max-height: 90px; overflow: auto; border-top: 1px solid #2c333d; }
/* copied from index.html */
.viewer-tip { position: absolute; z-index: 6; pointer-events: none; padding: 7px 10px; border-radius: 9px; background: rgba(14, 18, 22, .92); color: #eef2ef; font-size: 12.5px; line-height: 1.35; max-width: 260px; }
.viewer-tip b { font-family: var(--font-mono); font-weight: 600; color: #ffd84d; }
.viewer-tip span { color: #b9c3be; }
.gl-host { position: absolute; inset: 0; }
.gl-canvas { display: block; touch-action: none; cursor: grab; }
.pcb-view { position: absolute; inset: 0; background: var(--pcb-bg); }
.pcb-canvas { display: block; touch-action: none; cursor: crosshair; outline: none; }
.pcb-status { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 14px; font: 12px var(--font-mono); color: #9aa7a1; background: rgba(6, 9, 12, .72); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header id="nav"></header>
<div class="grid" id="grid"><div class="pane" id="p2d"></div><div class="pane v3d" id="p3d"></div></div>
<pre id="warn"></pre>

<script src="js/util.js"></script>
<script src="js/board.js"></script>
<script src="js/pcbview.js"></script>
<script src="js/gl3d.js"></script>
<script src="js/ds2k-engine.js"></script>
<script src="js/layout-gen.js"></script>
<script>
(function () {
  'use strict';
  const N = window.Noeti;
  const params = new URLSearchParams(location.search);
  const CIRCUITS = JSON.parse(document.getElementById('circuits').textContent);
  CIRCUITS.example = window.DS2K_EXAMPLE;
  const order = ['example', 'ldo', '555', 'opamp', 'npn', 'mcu', 'unknown', 'stm32'];
  const key = CIRCUITS[params.get('c')] ? params.get('c') : 'example';
  const view = params.get('view') || 'both';

  const r = DS2K.build(CIRCUITS[key], key, {});
  const t0 = performance.now();
  const out = N.layoutgen.generate(r.circuit, r.symbols, { title: r.circuit.design.title || key, schematic: r.files[r.name + '.kicad_sch'], name: r.name });
  const ms = performance.now() - t0;
  const B = new N.Board({ pcb: out.pcb, sch: null, bom: [], checks: [], power: out.power, stats: {} });
  window.__out = out;

  const nav = document.getElementById('nav');
  for (const k of order) {
    const a = document.createElement('a');
    a.href = '?c=' + k + (view !== 'both' ? '&view=' + view : '');
    a.textContent = k; if (k === key) a.className = 'on';
    nav.append(a);
  }
  const dl = document.createElement('a');
  dl.textContent = 'download .kicad_pcb';
  dl.href = URL.createObjectURL(new Blob([out.kicadPcb], { type: 'text/plain' }));
  dl.download = r.name + '.kicad_pcb';
  nav.append(dl);
  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = out.pcb.fps.length + ' footprints · ' + out.pcb.pads.length + ' pads · ' + out.pcb.air.length / 5 + ' airwires · ' + out.pcb.meta.w + ' x ' + out.pcb.meta.h + ' mm · ' + ms.toFixed(0) + ' ms';
  nav.append(meta);
  const warn = document.getElementById('warn');
  warn.textContent = out.warnings.length ? out.warnings.join('\n') : 'no warnings';

  const grid = document.getElementById('grid');
  const p2d = document.getElementById('p2d'), p3d = document.getElementById('p3d');
  if (view === '2d') { p3d.remove(); grid.classList.add('one'); }
  if (view === '3d') { p2d.remove(); grid.classList.add('one'); }
  document.documentElement.style.setProperty('--warn-h', warn.offsetHeight + 'px');

  if (view !== '3d') {
    const v = new N.PCBView(p2d);
    if (params.get('fab')) v.vis.fab = true;
    if (params.get('crtyd')) v.vis.crtyd = true;
    v.setBoard(B);
    requestAnimationFrame(() => { v.fit(); });
    v.on('select', (s) => v.setSelection(s.refs, s.nets));
    if (params.get('net')) { const ni = B.findNet(params.get('net')); if (ni > 0) v.setSelection([], [ni]); }
    window.__pcbview = v;
  }
  if (view !== '2d') {
    const host = document.createElement('div');
    host.className = 'gl-host';
    host.dataset.snapshot = '1';
    p3d.append(host);
    try {
      const v3 = new N.Viewer3D(host);
      requestAnimationFrame(() => { v3.setBoard(B); if (params.get('cam') === 'top') v3.view('top'); });
      window.__v3 = v3;
    } catch (e) { p3d.textContent = String(e); }
  }
  setTimeout(() => { window.__ready = true; }, 300);
})();
</script>

</html>
