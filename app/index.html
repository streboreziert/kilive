<title>KiLive</title>
<style>
/* Layout: a bench instrument. Library of boards (explore) → board page = viewer (the scope screen) + margin notes (about, KiLive). Probe-yellow marks anything traced. */
:root {
  --bg: #f3f4f0; --panel: #ffffff; --panel-2: #eef0eb; --ink: #15191b; --ink-2: #394044; --muted: #667075; --line: #dcdfda; --line-2: #e8ebe6;
  --accent: #0e7656; --accent-ink: #ffffff; --accent-soft: #e0f0e8; --probe: #e3a900; --probe-soft: #fff3c7;
  --pass: #1b834b; --warn: #a8640f; --fail: #bf3727; --info: #3462ad;
  --pass-soft: #e2f2e8; --warn-soft: #fbefd9; --fail-soft: #fbe5e1; --info-soft: #e5ecf8;
  --stage-a: #dfe3ea; --stage-b: #9aa3b3; --pcb-bg: #0b1014; --pcb-board: #111a20;
  --sch-bg: #e6e8e2; --sch-paper: #fbfaf5; --sch-frame: #8a3a2a; --sch-wire: #13804a; --sch-bus: #2350b8; --sch-body: #8a2a20; --sch-fill: #fff4d4;
  --sch-pin: #8a2a20; --sch-pinname: #146a6a; --sch-ref: #146a6a; --sch-text: #222222; --sch-note: #2350b8; --sch-sheet: #7a2a8c; --sch-sheet-fill: #faf3fb; --sch-nc: #2350b8; --sch-label: #1b1b1b;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-cond: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --shadow: none;
  --radius: 5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1113; --panel: #15191c; --panel-2: #1c2125; --ink: #e5eae6; --ink-2: #c2cac5; --muted: #8d9892; --line: #273034; --line-2: #1f262a;
    --accent: #45c79b; --accent-ink: #04130d; --accent-soft: #123126; --probe: #f2c233; --probe-soft: #3a300f;
    --pass: #53c784; --warn: #e3a44b; --fail: #f07462; --info: #79a2eb;
    --pass-soft: #12301f; --warn-soft: #36270f; --fail-soft: #3a1914; --info-soft: #172640;
    --stage-a: #3b4352; --stage-b: #1b2029; --pcb-bg: #080b0e; --pcb-board: #0f171d;
    --sch-bg: #0e1215; --sch-paper: #171b1f; --sch-frame: #b8705f; --sch-wire: #4fc184; --sch-bus: #6d95f0; --sch-body: #e08a74; --sch-fill: #2a2618;
    --sch-pin: #e08a74; --sch-pinname: #6fc6c0; --sch-ref: #6fc6c0; --sch-text: #d6dbd7; --sch-note: #7ea2f0; --sch-sheet: #c68ad6; --sch-sheet-fill: #1f1824; --sch-nc: #7ea2f0; --sch-label: #e6ebe7;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1113; --panel: #15191c; --panel-2: #1c2125; --ink: #e5eae6; --ink-2: #c2cac5; --muted: #8d9892; --line: #273034; --line-2: #1f262a;
  --accent: #45c79b; --accent-ink: #04130d; --accent-soft: #123126; --probe: #f2c233; --probe-soft: #3a300f;
  --pass: #53c784; --warn: #e3a44b; --fail: #f07462; --info: #79a2eb;
  --pass-soft: #12301f; --warn-soft: #36270f; --fail-soft: #3a1914; --info-soft: #172640;
  --stage-a: #3b4352; --stage-b: #1b2029; --pcb-bg: #080b0e; --pcb-board: #0f171d;
  --sch-bg: #0e1215; --sch-paper: #171b1f; --sch-frame: #b8705f; --sch-wire: #4fc184; --sch-bus: #6d95f0; --sch-body: #e08a74; --sch-fill: #2a2618;
  --sch-pin: #e08a74; --sch-pinname: #6fc6c0; --sch-ref: #6fc6c0; --sch-text: #d6dbd7; --sch-note: #7ea2f0; --sch-sheet: #c68ad6; --sch-sheet-fill: #1f1824; --sch-nc: #7ea2f0; --sch-label: #e6ebe7;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 400 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font: 500 12px/1.2 var(--font-sans); color: var(--muted); }
.ico { display: inline-flex; flex: none; line-height: 0; }
.ico.tiny svg { width: 12px; height: 12px; }
.grow { flex: 1; }

/* ---------- top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 18px; height: 50px; padding: 0 18px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none !important; }
.brand-name { font: 600 16px/1 var(--font-sans); letter-spacing: 0; }
.brand-sub { font: 600 16px/1 var(--font-sans); color: var(--ink); margin-left: -5px; }
.top-search { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 36px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); }
.top-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; }
.top-nav { margin-left: auto; display: flex; gap: 18px; align-items: center; }
.top-nav a { color: var(--ink-2); font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }

/* ---------- common controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: transparent; }
.btn.tiny { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 4px; gap: 5px; }
.btn.icon-only { width: 38px; padding: 0; justify-content: center; }
.btn .count { padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--line); color: var(--ink-2); }
.btn.starred .star-ico { color: var(--probe); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn.small { width: 26px; height: 26px; }
.input { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); font: inherit; padding: 8px 11px; }
.input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
.input.small { padding: 5px 9px; font-size: 13px; }
textarea.input { resize: vertical; line-height: 1.45; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 4px; cursor: pointer; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.seg button.active { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.seg.small button { padding: 4px 10px; font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 8px; border-radius: 3px; font: 500 12px/18px var(--font-mono); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.pass { background: var(--pass-soft); color: var(--pass); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.fail { background: var(--fail-soft); color: var(--fail); }
.pill.info { background: var(--info-soft); color: var(--info); }
.tag { display: inline-block; padding: 0 7px; border-radius: 6px; font: 500 11.5px/19px var(--font-mono); background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); vertical-align: middle; }
.tag.pwr { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.muted { color: var(--muted); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }

/* menus */
.menu-pop { position: fixed; z-index: 100; min-width: 220px; max-width: min(420px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 12px 36px rgba(0,0,0,.18); }
.menu-pop.wide { min-width: 300px; }
.menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; border-radius: 4px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; text-decoration: none !important; }
.menu-item:hover, .menu-item:focus-visible { background: var(--panel-2); outline: none; }
.menu-item.active { background: var(--accent-soft); color: var(--accent); }
.mi-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi-hint { font: 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
.menu-head { padding: 8px 10px 4px; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu-sep { height: 1px; margin: 5px 4px; background: var(--line); }
.menu-checks { display: grid; padding: 2px 4px 6px; }
.menu-check { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.menu-check:hover { background: var(--panel-2); }
.menu-check input { accent-color: var(--accent); width: 15px; height: 15px; }
.info-pop { padding: 2px 8px 8px; display: grid; gap: 10px; min-width: min(360px, calc(100vw - 40px)); }
.kv-table { border-collapse: collapse; width: 100%; font-size: 13px; }
.kv-table th { text-align: left; font-weight: 400; color: var(--muted); padding: 4px 16px 4px 0; white-space: nowrap; vertical-align: top; }
.kv-table td { padding: 4px 0; text-align: right; }
.share-pop { padding: 2px 8px 8px; display: grid; gap: 12px; max-width: 380px; }
.share-pop p { margin: 0; }
.share-line { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.share-code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 5px 8px; border-radius: 7px; background: var(--panel-2); font: 12.5px var(--font-mono); }

#toasts { position: fixed; z-index: 200; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; pointer-events: none; }
.toast { padding: 10px 16px; border-radius: 4px; background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: var(--shadow); transition: opacity .4s, transform .4s; max-width: min(520px, calc(100vw - 32px)); }
.toast.warn { background: var(--warn); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- explore */
main { padding-inline: 24px; padding-block: 0 40px; }
main.explore { max-width: 1320px; margin: 0 auto; }
.lede { font-size: 13.5px; line-height: 1.5; color: var(--muted); max-width: 64ch; margin: 0; }
.topic-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.lic { display: inline-flex; gap: 5px; align-items: center; font: 500 12px var(--font-mono); color: var(--muted); }
.topic { font: 11.5px var(--font-mono); color: var(--muted); }
.foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
@media (max-width: 600px) { .lede { font-size: 15px; } }

.fatal { padding: 80px 0; text-align: center; }

/* ---------- board page */
main.board { max-width: 1520px; margin: 0 auto; }
.board-page { padding-top: 22px; }
.bp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.crumbs { display: flex; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.bp-h1row { display: flex; gap: 12px; align-items: center; }
.bp-h1row h1 { font: 600 24px/1.2 var(--font-sans); letter-spacing: 0; }
.bp-facts { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.crumbs a.mono { color: var(--muted); }
.public { font: 500 12px var(--font-sans); padding: 2px 8px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink-2); }
.bp-owner { color: var(--muted); margin-top: 2px; }
.bp-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.bp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 26px; align-items: start; }
.bp-main { display: grid; gap: 20px; min-width: 0; }
.bp-side { display: grid; gap: 22px; min-width: 0; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }

.viewer-card { scroll-margin-top: 66px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.viewer-card.maximized { position: fixed; inset: env(safe-area-inset-top, 0px) 0 0 0; z-index: 50; border-radius: 0; }
.viewer-card:fullscreen { border-radius: 0; }
.vc-tabs { display: flex; align-items: center; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.vc-tabs::-webkit-scrollbar { display: none; }
.vc-tab { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink-2); font: 500 13.5px var(--font-mono); cursor: pointer; white-space: nowrap; flex: none; }
.vc-tab:hover { background: var(--panel-2); }
.vc-tab.active { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); color: var(--accent); }
.tab-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; font: 600 11px/18px var(--font-mono); text-align: center; }
.tab-badge.fail { background: var(--fail); color: #fff; }
.tab-badge.warn { background: var(--warn-soft); color: var(--warn); }
.vc-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ver-btn { font-family: var(--font-mono); height: 36px; }
.vsep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
.vc-body { position: relative; height: clamp(440px, 68vh, 760px); }
.pane-panel { position: absolute; inset: 0; overflow: auto; }
#pane-bom.on { display: flex; flex-direction: column; }
#pane-bom .table-wrap.scroll { flex: 1; min-height: 160px; overflow: auto; }
.maximized .vc-body, .viewer-card:fullscreen .vc-body { height: calc(100% - 59px) !important; overflow: auto; }
.pane { display: none; }
.pane.on { display: block; }
.pane-3d, .pane-pcb, .pane-sch { position: absolute; inset: 0; }
.pane-panel { padding: 20px 24px 24px; }
.loading { position: absolute; inset: 0; z-index: 20; display: flex; gap: 12px; align-items: center; justify-content: center; background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--ink-2); }
.loading[hidden] { display: none; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.viewer-empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; color: var(--muted); padding: 24px; }
.viewer-tip { position: absolute; z-index: 6; pointer-events: none; padding: 7px 10px; border-radius: 4px; background: rgba(14, 18, 22, .92); color: #eef2ef; font-size: 12.5px; line-height: 1.35; max-width: 260px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.viewer-tip b { font-family: var(--font-mono); font-weight: 600; color: #ffd84d; }
.viewer-tip span { color: #b9c3be; }

/* 3D stage */
.pane-3d { background: linear-gradient(180deg, var(--stage-a) 0%, var(--stage-b) 100%); }
.pane-3d[data-light="bench"] { background: linear-gradient(180deg, #e9ddc8 0%, #8e7f6a 100%); }
.pane-3d[data-light="inspect"] { background: linear-gradient(180deg, #f7f8fa 0%, #d5dae1 100%); }
.pane-3d[data-light="night"] { background: radial-gradient(120% 90% at 50% 0%, #25303f 0%, #0a0d12 70%); }
.gl-host { position: absolute; inset: 0; }
.gl-canvas { display: block; touch-action: none; cursor: grab; }
.gl-canvas:active { cursor: grabbing; }
.ov-tl-stack { position: absolute; left: 16px; top: 16px; display: grid; gap: 14px; justify-items: start; z-index: 4; }
.ov-tr { position: absolute; right: 16px; top: 16px; z-index: 4; }
.ov-bottom { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4; }
.ov-help { position: absolute; left: 16px; bottom: 22px; max-width: calc(50% - 250px); font-size: 12px; line-height: 1.4; z-index: 3; color: rgba(20, 24, 30, .62); }
@media (max-width: 1100px) { .ov-help { display: none; } }
.pane-3d[data-light="night"] .ov-help { color: rgba(230, 236, 240, .5); }
.vc-body.live-on .ov-help { display: none; }
.board-chooser { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: pointer; font-size: 14.5px; }
.bc-name { font-weight: 500; }
.seg.overlay { background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px); }
.toolbar { display: flex; align-items: center; gap: 2px; padding: 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.tb { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; font-weight: 500; white-space: nowrap; }
.tb:hover { background: var(--panel-2); color: var(--ink); }
.tb.on { background: var(--accent-soft); color: var(--accent); }
.tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 3px; }
@media (max-width: 600px) { .ov-bottom .tb-l { display: none; } .ov-bottom .tb { padding: 0 10px; } }
.ocube-wrap { width: 76px; height: 76px; perspective: 260px; margin-left: 10px; }
.ocube { position: relative; width: 60px; height: 60px; margin: 8px; transform-style: preserve-3d; }
.oface { position: absolute; inset: 0; display: grid; place-items: center; border: 1px solid rgba(40, 46, 56, .25); background: rgba(248, 249, 251, .93); color: #3e4550; font: 600 9.5px var(--font-mono); letter-spacing: .12em; cursor: pointer; backface-visibility: hidden; padding: 0; border-radius: 3px; }
.oface:hover { background: #fff7d6; color: #6b5200; }
.oface.front { transform: translateZ(30px); }
.oface.back { transform: rotateY(180deg) translateZ(30px); }
.oface.right { transform: rotateY(90deg) translateZ(30px); }
.oface.left { transform: rotateY(-90deg) translateZ(30px); }
.oface.top { transform: rotateX(90deg) translateZ(30px); }
.oface.bottom { transform: rotateX(-90deg) translateZ(30px); }

/* PCB */
.pcb-view { position: absolute; inset: 0; background: var(--pcb-bg); }
.pcb-canvas { display: block; touch-action: none; cursor: crosshair; outline: none; }
.pcb-status { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 14px; font: 12px var(--font-mono); color: #9aa7a1; background: rgba(6, 9, 12, .72); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-top { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 4; flex-wrap: wrap; }
.ov-inline { display: flex; }
.ov-top .board-chooser { height: 34px; box-shadow: none; border: 0; background: var(--panel-2); }
.finder { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; color: var(--muted); }
.finder .input { width: 210px; max-width: 42vw; }
.ov-top .finder .input { width: 170px; }
/* the probe tool stands out from the other tools: it is what starts the board running */
.tb.probe-tool-btn { border: 1px solid transparent; }
.tb.probe-tool-btn.on { background: var(--probe, #ffd21f); color: #1a1500; border-color: color-mix(in srgb, var(--probe, #ffd21f) 70%, #000); }
.sch-canvas.probe-tool, .pcb-canvas.probe-tool { cursor: crosshair; }
.finder-list { position: absolute; top: calc(100% + 6px); left: 0; width: 320px; max-width: 80vw; z-index: 20; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.finder-item { display: flex; gap: 8px; align-items: center; width: 100%; padding: 6px 8px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
.finder-item.active, .finder-item:hover { background: var(--panel-2); }
.finder-item .muted { margin-left: auto; }
.fi-kind { font: 600 10px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; }
.fi-kind.ref { background: var(--info-soft); color: var(--info); }
.fi-kind.net { background: var(--probe-soft); color: color-mix(in srgb, var(--probe) 70%, var(--ink)); }
.layer-legend { position: absolute; left: 12px; bottom: 36px; z-index: 4; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 24px); }
.lg { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,.1); background: rgba(10, 14, 18, .75); color: #d8e0db; font: 11.5px var(--font-mono); cursor: pointer; }
.lg.off { opacity: .45; }
.lg.off .sw { background: transparent !important; border: 1px solid #6b7570; }
.sw { width: 10px; height: 10px; border-radius: 3px; }

/* schematic */
.pane-sch { display: none; flex-direction: column; background: var(--sch-bg); }
.pane-sch.on { display: flex; }
.sch-bar { position: static; margin: 10px 12px 0; flex: none; }
.sch-host { position: relative; flex: 1; min-height: 0; }
.sch-view { position: absolute; inset: 0; display: flex; }
.sch-sheets { width: 200px; flex: none; overflow: auto; padding: 10px 8px; border-right: 1px solid var(--line); background: var(--panel); }
.sch-sheets-head { display: flex; align-items: center; justify-content: space-between; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 4px 8px 8px; }
.sch-fold { border: 0; background: transparent; color: var(--muted); font: 600 16px/1 var(--font-sans); width: 26px; height: 24px; border-radius: 6px; cursor: pointer; }
.sch-fold:hover { background: var(--hover, rgba(0,0,0,.06)); color: var(--ink); }
.sch-unfold { display: none; position: absolute; left: 10px; top: 10px; z-index: 3; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); font: 500 12px var(--font-sans); padding: 5px 10px; border-radius: 4px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.sch-view.sheets-folded .sch-sheets { display: none; }
.sch-view.sheets-folded .sch-unfold { display: block; }
.sch-sheet { display: flex; gap: 8px; width: 100%; align-items: baseline; padding: 6px 8px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); text-align: left; cursor: pointer; font-size: 13px; }
.sch-sheet:hover { background: var(--panel-2); }
.sch-sheet.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.sch-sheet-no { font: 11px var(--font-mono); color: var(--muted); min-width: 14px; }
.sch-sheet-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sch-stage { position: relative; flex: 1; min-width: 0; }
.sch-canvas { display: block; touch-action: none; outline: none; }

/* selection card */
.selcard { position: absolute; right: 14px; top: 70px; z-index: 8; width: 300px; max-width: calc(100% - 28px); max-height: calc(100% - 150px); overflow: auto; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); box-shadow: 0 10px 30px rgba(0,0,0,.16); display: grid; gap: 8px; }
.vc-body[data-tab="3d"] .selcard { top: 66px; }
.vc-body[data-tab="sch"] .selcard { top: 72px; }
.sc-close { position: absolute; right: 6px; top: 6px; }
.sc-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding-right: 28px; }
.sc-ref { font-size: 19px; font-weight: 600; }
.sc-kind { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sc-val { font-weight: 500; }
.sc-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.sc-desc { margin: 0; font-size: 13px; color: var(--ink-2); }
.sc-kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.sc-kv span { color: var(--muted); }
.sc-kv b { font-weight: 500; text-align: right; overflow-wrap: anywhere; }
.sc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.sc-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.sc-acts { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line-2); }
.sc-link { display: inline-flex; gap: 4px; align-items: center; }
.probe-chip { display: inline-flex; align-items: center; padding: 0 5px; border-radius: 6px; font: 500 12px/20px var(--font-mono); border: 1px solid transparent; cursor: pointer; vertical-align: baseline; }
.probe-chip.ref { background: var(--info-soft); color: var(--info); }
.probe-chip.net { background: var(--probe-soft); color: color-mix(in srgb, var(--probe) 62%, var(--ink)); }
.probe-chip:hover { border-color: currentColor; }
.probe-chip.static { cursor: default; }

/* panels */
.panel-head { margin-bottom: 14px; }
.stat-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.stat { padding: 12px 14px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat-v { font: 600 22px/1.1 var(--font-cond); font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; color: var(--muted); }
.panel-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.search-wrap { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; padding-left: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); }
.search-wrap .input { border: 0; padding-left: 0; }
.search-wrap .input:focus { outline: none; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font: 500 11.5px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th.sortable { cursor: pointer; }
table.data th.sorted { color: var(--ink); }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover td { background: var(--panel-2); }
table.data tr.selected td { background: var(--probe-soft) !important; }
table.data tr.dnp td { color: var(--muted); }
/* the BOM fits its card: long descriptions clamp to two lines, footprints break, part numbers stay whole */
table.data.bom td.desc { min-width: 180px; max-width: 320px; }
table.data.bom .desc-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
table.data.bom td.desc > :first-child, table.data.bom td.desc { overflow-wrap: anywhere; }
table.data.bom td.mono.small { max-width: 150px; overflow-wrap: anywhere; }
table.data.bom td.refs { max-width: 220px; }
table.data.bom .mpn .mono { overflow-wrap: anywhere; }
td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); width: 1%; }
td.refs { min-width: 170px; max-width: 300px; }
td.desc { color: var(--ink-2); min-width: 220px; max-width: 360px; }
table.bom { min-width: 980px; }
table.bom td.mono.small { font-size: 12px; overflow-wrap: anywhere; max-width: 220px; }
td.act { width: 1%; }
.val { font-weight: 500; }
.mpn { display: grid; }
.missing { font: 12px var(--font-mono); color: var(--warn); }
.ds { margin-left: 6px; font-size: 12px; }
.card-inset { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.diff { padding: 14px 16px; margin-bottom: 14px; }
.diff-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.diff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.diff-title { display: flex; gap: 8px; align-items: center; font-weight: 500; margin-bottom: 6px; }
.diff-list { margin: 0; padding: 0; list-style: none; font: 12.5px/1.7 var(--font-mono); max-height: 220px; overflow: auto; }
.loading-line { color: var(--muted); padding: 8px 0 14px; }

/* checks */
.checks-head { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 22px; margin-bottom: 18px; }
.big-counts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.bc { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-radius: 4px; font-size: 13px; }
.bc b { font: 600 28px/1 var(--font-cond); }
.bc.fail { background: var(--fail-soft); color: var(--fail); }
.bc.warn { background: var(--warn-soft); color: var(--warn); }
.bc.pass { background: var(--pass-soft); color: var(--pass); }
.bc.info { background: var(--info-soft); color: var(--info); }
.readiness { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; display: grid; gap: 10px; }
.readiness-title { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.meter-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.meter-bar { height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.meter-bar span { display: block; height: 100%; border-radius: 4px; }
.meter-bar .good { background: var(--pass); }
.meter-bar .mid { background: var(--warn); }
.meter-bar .low { background: var(--fail); }
.check-cat { font: 500 11.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.check { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; background: var(--panel); }
.check-sumrow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; }
.check summary { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer; list-style: none; }
.check summary::-webkit-details-marker { display: none; }
.check-main { flex: 1; min-width: 0; }
.check-title { font-weight: 600; }
.check-sum { color: var(--ink-2); font-size: 13px; }
.check-n { font: 500 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
.check .chev { transition: transform .2s; color: var(--muted); padding-top: 2px; }
.check[open] .chev { transform: rotate(180deg); }
.check-body { padding: 0 14px 12px; }
.finding-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line-2); }
.finding-list li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.finding-t { min-width: 0; overflow-wrap: anywhere; }
.check-actions { padding-top: 10px; }
.check-passed { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; }
.check-passed > summary { display: flex; align-items: center; gap: 8px; padding: 10px 2px; cursor: pointer; list-style: none; font-weight: 600; color: var(--ink-2); }
.check-passed > summary::-webkit-details-marker { display: none; }
.check-passed > summary .chev svg { width: 14px; height: 14px; transform: rotate(-90deg); transition: transform .15s; }
.check-passed[open] > summary .chev svg { transform: none; }
.check-passed > summary .muted { font-weight: 400; }
.checks-clean { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--pass-soft); color: var(--pass); font-weight: 500; }

/* files */
.files-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
.files-col { display: grid; gap: 18px; min-width: 0; }
.files-col > *, .export-grid > * { min-width: 0; }
.export .muted { overflow-wrap: anywhere; }
.files-head { display: flex; gap: 8px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.files-head .muted { margin-left: auto; font-weight: 400; }
.file-list, .commit-list { list-style: none; margin: 0; padding: 4px 0; max-height: 360px; overflow: auto; }
.file-list li { display: flex; gap: 10px; align-items: center; padding: 5px 14px; }
.file-list li:hover { background: var(--panel-2); }
.file-link { display: inline-flex; gap: 8px; align-items: center; min-width: 0; flex: 1; color: var(--ink); }
.file-link .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.commit-list li { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; padding: 7px 14px; border-bottom: 1px solid var(--line-2); }
.commit-list li .muted { grid-column: 2; }
.commit-msg { min-width: 0; overflow-wrap: anywhere; }
.export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.export { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none !important; }
.export:hover { border-color: var(--accent); }
.readme { min-width: 0; }
.md { padding: 4px 16px 16px; overflow-wrap: anywhere; }
.md h2, .md h3, .md h4 { font-family: var(--font-cond); margin: 18px 0 6px; }
.md h2 { font-size: 22px; } .md h3 { font-size: 18px; } .md h4 { font-size: 15px; }
.md p, .md li { color: var(--ink-2); max-width: 70ch; }
.md pre { overflow-x: auto; padding: 10px 12px; background: var(--panel-2); border-radius: 4px; font-size: 12.5px; }
.md code { font-family: var(--font-mono); font-size: .92em; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.md .md-table { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; }
.md blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md-img { font: 12px var(--font-mono); color: var(--muted); }

/* sidebar */
/* ---- Explore: a plain catalogue. Title, one line, a sidebar of filters, a toolbar, the boards. */
.ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 28px 0 18px; border-bottom: 1px solid var(--line); }
.ex-head h1 { font: 600 22px/1.2 var(--font-sans); letter-spacing: 0; margin: 0 0 4px; }
.ex-lede { margin: 0; max-width: 64ch; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.ex-lede a { color: var(--accent); }
.ex-head .btn { flex: none; margin-top: 4px; }
.ex-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; padding-top: 20px; align-items: start; }
.ex-side { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); display: grid; gap: 22px; }
.ex-side h2 { font: 600 12px/1 var(--font-sans); color: var(--muted); margin: 0 0 8px; }
.ex-cat-list { list-style: none; margin: 0; padding: 0; }
.ex-cat-list button { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 5px 8px 5px 10px; border: 0; border-left: 2px solid transparent; border-radius: 0 6px 6px 0; background: none; color: var(--ink-2); font: 14px var(--font-sans); text-align: left; cursor: pointer; }
.ex-cat-list button:hover { background: var(--panel-2); color: var(--ink); }
.ex-cat-list button.on { border-left-color: var(--ink); background: var(--panel-2); color: var(--ink); font-weight: 600; }
.ex-cat-list .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.ex-side-row { display: none; }
.ex-sel { height: 32px; max-width: 100%; padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: 13.5px var(--font-sans); cursor: pointer; }
.ex-check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.ex-check input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
.ex-mine p { margin: 0 0 6px; line-height: 1.45; }
.ex-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; }
.ex-sw { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 10px; width: min(360px, 100%); border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); }
.ex-sw:focus-within { border-color: var(--ink); }
.ex-search { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px; }
.ex-spacer { flex: 1; }
.ex-count { white-space: nowrap; }
.ex-clear { font-size: 13px; }
.ex-sort { display: inline-flex; align-items: center; gap: 8px; }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.lnk:hover { text-decoration: underline; }
.lnk .ico svg { width: 12px; height: 12px; }
.ex-view { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.ex-vb { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; }
.ex-vb + .ex-vb { border-left: 1px solid var(--line); }
.ex-vb.on { background: var(--panel-2); color: var(--ink); }
.ex-vb .ico svg { width: 14px; height: 14px; }
.ex-results { min-height: 40vh; }
.ex-h2 { font: 600 15px/1.3 var(--font-sans); margin: 8px 0 10px; }
.community .repo-grid { margin-bottom: 20px; }
.empty-note { padding: 28px; text-align: center; color: var(--muted); }
.repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px 16px; }
.repo-card { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); overflow: hidden; text-decoration: none !important; }
.repo-card:hover { border-color: var(--muted); }
.repo-card:hover h3 { text-decoration: underline; }
.thumb { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--panel-2); overflow: hidden; border-bottom: 1px solid var(--line-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rc-body { padding: 11px 13px 12px; display: grid; gap: 5px; align-content: start; flex: 1; }
.repo-card h3 { font: 600 15.5px/1.3 var(--font-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-desc { margin: 0; color: var(--ink-2); font-size: 13px; line-height: 1.45; min-height: 2.9em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rc-facts { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.rc-facts > span + span::before { content: ' · '; color: var(--muted); }
.rc-fw { color: var(--accent); }
.rc-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.rc-owner { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
.rc-foot .stars-count { margin-left: auto; }
.stars-count { display: inline-flex; gap: 4px; align-items: center; }
.rc-fail { color: var(--fail); }
.repo-list { display: grid; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
.rl-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 120px 110px 64px 56px 96px; gap: 12px; align-items: center; padding: 8px 14px; color: var(--ink); text-decoration: none !important; border-top: 1px solid var(--line-2); }
.rl-row:hover { background: var(--panel-2); }
.rl-head { border-top: 0; font: 600 12px var(--font-sans); color: var(--muted); padding-block: 9px; }
.rl-head:hover { background: none; }
.rl-thumb { width: 64px; height: 40px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.rl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rl-main { display: grid; min-width: 0; gap: 1px; }
.rl-main b { display: block; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rl-desc { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
@media (max-width: 900px) {
  .rl-row { grid-template-columns: 56px minmax(0, 1fr) 90px 60px; }
  .rl-row > :nth-child(3), .rl-row > :nth-child(6), .rl-row > :nth-child(7) { display: none; }
}
@media (max-width: 760px) {
  .ex-head { padding: 18px 0 14px; }
  .ex-layout { grid-template-columns: 1fr; gap: 14px; }
  .ex-side { position: static; display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px 12px; align-items: center; }
  .ex-check { white-space: nowrap; }
  .ex-side h2, .ex-cat-list, .ex-mine { display: none; }
  .ex-side-row { display: block; }
  .ex-side-sec:first-child, .ex-sel { width: 100%; }
  .ex-sw { width: 100%; }
  .ex-spacer, .ex-count { display: none; }

  background: var(--sch-bg); color: var(--ink); font: 400 14px/1.45 var(--font-sans); -webkit-user-select: none; user-select: none; }

/* toolbar */
.se-bar { flex: none; margin: 10px 12px; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }

.se-pal-list { flex: 1; min-height: 0; overflow: auto; padding: 2px 6px 12px; scrollbar-width: thin; }

  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line-2); color: var(--muted); font: 11.5px/18px var(--font-mono); pointer-events: none; white-space: nowrap; overflow: hidden; }
